<div style="font-family:Segoe UI,Arial,sans-serif;max-width:640px">
  <h2 style="color:{{COLOR}};margin-bottom:4px">{{ICONO}} StockFlow · {{RESULTADO}}</h2>
  <p style="color:#616e7c;margin-top:0">Pipeline CI de Jenkins</p>
  <table cellpadding="6" style="border-collapse:collapse;font-size:14px">
    <tr><td><b>Job</b></td><td>{{JOB}}</td></tr>
    <tr><td><b>Build</b></td><td>#{{BUILD}}</td></tr>
    <tr><td><b>Rama</b></td><td>{{RAMA}} <span style="color:#616e7c">({{TIPO}})</span></td></tr>
    <tr><td><b>Commit</b></td><td>{{COMMIT}}</td></tr>
    <tr><td><b>Tests</b></td><td>{{TESTS}}</td></tr>
    <tr><td><b>Etapas</b></td><td>{{ETAPAS}}</td></tr>
    <tr><td><b>Duración</b></td><td>{{DURACION}}</td></tr>
    <tr><td><b>Detalle</b></td><td><a href="{{URL}}">{{URL}}</a></td></tr>
  </table>
</div>
