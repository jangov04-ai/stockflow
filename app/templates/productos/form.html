{% extends "base.html" %}
{% block titulo %}{{ "Editar" if producto else "Nuevo" }} producto{% endblock %}
{% block contenido %}
<h1>{{ "Editar " ~ producto.sku if producto else "Nuevo producto" }}</h1>

<form method="post" class="formulario" id="form-producto">
  {% if not producto %}
  <label>SKU
    <input name="sku" id="sku" value="{{ datos.get('sku', '') }}" placeholder="ABC-001" required>
  </label>
  {% endif %}
  <label>Nombre
    <input name="nombre" id="nombre" value="{{ datos.get('nombre', '') }}" required>
  </label>
  <label>Categoría
    <input name="categoria" id="categoria" value="{{ datos.get('categoria', '') }}" placeholder="Ej. Papelería">
  </label>
  <div class="fila">
    <label>Precio (USD)
      <input name="precio" id="precio" type="number" step="0.01" min="0" value="{{ datos.get('precio', '') }}" required>
    </label>
    <label>Stock mínimo
      <input name="stock_minimo" id="stock_minimo" type="number" min="0" value="{{ datos.get('stock_minimo', 5) }}" required>
    </label>
  </div>
  <div class="botones">
    <button type="submit" class="boton" id="guardar">Guardar</button>
    <a href="{{ url_for('web.lista_productos') }}">Cancelar</a>
  </div>
</form>
{% endblock %}
