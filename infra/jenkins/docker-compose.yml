# Mismo nombre de proyecto que la práctica anterior: reutiliza el contenedor
# y el volumen de datos de Jenkins (historial de builds, credenciales...).
name: jenkins

services:
  jenkins:
    build: .
    image: jenkins-ci-local
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    env_file: .env
    volumes:
      - jenkins_home:/var/jenkins_home
    depends_on:
      - sonarqube

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs

volumes:
  jenkins_home:
  sonar_data:
  sonar_extensions:
  sonar_logs:
